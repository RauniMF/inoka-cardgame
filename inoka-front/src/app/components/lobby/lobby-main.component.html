<div class="lobby-main-container">
    <h2> Lobby </h2>
    <div class="players-container">
        <p>{{ lobbyStatus() }}</p>
        <div class="player-entry-grid">
            @for (player of players; track player.seat; let index = $index) {
                <div class="entry-position" [ngClass]="'position-' + (index + 1)">
                    <app-player-entry
                        [player]="player"
                    ></app-player-entry>
                </div>
            }
        </div>
        <div class="user-buttons">
            <button class="ready-button" [attr.disabled]="this.player?.ready ? true : null" (click)="toggleReady()">Ready Up</button>
            <button class="leave-button" (click)="leaveGame()">Leave Game</button>
        </div>
    </div>
</div>
